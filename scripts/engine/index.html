<!doctype html>
<html><head><meta charset="utf-8"><title>Art History Speedrun · recreation</title>
<style>
html,body{margin:0;background:#111;overflow:hidden}
canvas{display:block;width:100vw;height:auto;max-width:1920px}
#ui{position:fixed;left:8px;bottom:8px;color:#ddd;font:12px monospace}
body.render #ui{display:none}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><input id="scrub" type="range" min="0" max="60" step="0.0166667" value="0" style="width:600px"> <span id="tt"></span> <button id="play">play</button></div>
<script src="lib/fonts.js"></script>
<script src="lib/util.js"></script>
<script src="lib/paint.js"></script>
<script src="lib/brush.js"></script>
<script src="lib/render.js"></script>
<script src="lib/post.js"></script>
<script src="lib/rig.js"></script>
<script src="lib/rig_huashu.js"></script>
<script src="lib/kit.js"></script>
<!-- YouTube explainer grammar libraries (references/09): motion timing, camera, diagram morphs, text, charts, keynote UI, collage, cartoons -->
<script src="lib/motion.js"></script>
<script src="lib/camera.js"></script>
<script src="lib/diagram.js"></script>
<script src="lib/typo.js"></script>
<script src="lib/chart.js"></script>
<script src="lib/ui.js"></script>
<script src="lib/collage.js"></script>
<script src="lib/media.js"></script>
<script src="lib/toon.js"></script>
<script>
// Choose the film: eras.js by default; ?film=<name> → eras_<name>.js (e.g., ?film=gallery = the 35-style sample film); ?film=demos/<name> → demos/<name>/eras.js (the 8 YouTube grammar demos).
// render.py / qa.py pass it with --film.
(() => { const f = new URLSearchParams(location.search).get('film');
  const src = f && /^demos\/[a-z0-9_]+$/.test(f) ? `${f}/eras.js` : f && /^[a-z0-9_]+$/.test(f) ? `eras_${f}.js` : 'eras.js';
  document.write(`<script src="${src}"><\/script>`); })();
</script>
<script src="transitions.js"></script>
<script src="scenes/index.js"></script>
<script src="engine.js"></script>
</body></html>
